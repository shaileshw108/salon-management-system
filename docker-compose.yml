services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: salon_queue
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - salon_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon_queue"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://salon:${POSTGRES_PASSWORD}@db:5432/salon_queue
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      OWNER_USERNAME: ${OWNER_USERNAME:?Set OWNER_USERNAME}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  salon_postgres:
